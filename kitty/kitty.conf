include ~/.cache/wal/colors-kitty.conf
editor ~/.local/bin/nvim
enable_audio_bell no   
# Enable the cursor trail (value is in milliseconds; >0 activates it)
cursor_trail 3

# Control the fade speed of the trail (fastest decay, slowest decay in seconds)
cursor_trail_decay 0.1 0.4

# Minimum cell movement required to trigger the trail (x, y)
cursor_trail_start_threshold 2

# block, beam, or underline
cursor_shape beam

# block, beam, underline, hollow, or unchanged
cursor_shape_unfocused hollow
